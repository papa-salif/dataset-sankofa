services:
  app:
    build: .
    container_name: moore-collector
    # Postgres (Neon) et le stockage audio (R2) sont tous les deux externes :
    # plus besoin de host.docker.internal ni de volume local pour l'audio.
    env_file:
      - .env
    ports:
      - "8502:8501"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: moore-collector-caddy
    ports:
      # 443 est déjà pris par un autre conteneur (pgAdmin) sur cette machine.
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
